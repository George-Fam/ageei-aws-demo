stages:
  - dependencies
  - lint
  - build
  - deploy

variables:
  API_TOKEN: $DEPLOYMENT_TOKEN
  APP_PATH: '$CI_PROJECT_DIR/client-web'
  OUTPUT_PATH: '$CI_PROJECT_DIR/client-web/public' # Angular output path. Defined in angular.json
  API_PATH: '' # empty for now


install_dependencies:
  image: node:16-alpine
  stage: dependencies
  script:
    - cd client-web
    - npm install
  only:
    - main
  cache:
    key:
      files:
        - client-web/package-lock.json
    paths:
      - client-web/node_modules

lint:
  image: node:16-alpine
  stage: lint
  script:
    - cd client-web
    - npm link @angular/cli@13.1.2
    - ng lint
  cache:
    key:
      files:
        - client-web/package-lock.json
    paths:
      - client-web/node_modules/
    policy: pull
  only:
    - main

build:
  image: node:16-alpine
  stage: build
  script:
    - cd client-web
    - npm install -g @angular/cli@13.1.2
    - npm install
    - ng build --prod
  artifacts:
    paths:
      - client-web/dist/angular-basic
  only:
    - main

deploy:
  stage: deploy
  image: registry.gitlab.com/static-web-apps/azure-static-web-apps-deploy
  script:
    - echo "App deployed successfully."
  only:
    - main
