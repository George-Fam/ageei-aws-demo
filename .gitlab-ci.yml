stages:
  - dependencies
  - lint
  - format
  - build
  - sync
  - deploy

variables:
  API_TOKEN: $DEPLOYMENT_TOKEN
  APP_PATH: '$CI_PROJECT_DIR/client-web'
  OUTPUT_PATH: '$CI_PROJECT_DIR/client-web/public/browser' # Angular output path. Defined in angular.json
  API_PATH: '' # empty for now


install_dependencies:
  image: node:22-alpine
  stage: dependencies
  script:
    - cd client-web
    - npm install
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  cache:
    key:
      files:
        - client-web/package-lock.json
    paths:
      - client-web/node_modules

lint:
  image: node:22-alpine
  stage: lint
  script:
    - cd client-web
    - npx ng lint
  cache:
    key:
      files:
        - client-web/package-lock.json
    paths:
      - client-web/node_modules/
    policy: pull
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

prettier:
  image: node:22-alpine
  stage: format
  script:
    - cd client-web
    - npm run prettier-check
  cache:
    key:
      files:
        - client-web/package-lock.json
    paths:
      - client-web/node_modules/
    policy: pull
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

build:
  image: node:22-alpine
  stage: build
  script:
    - cd client-web
    - npx ng build --configuration production
  cache:
    key:
      files:
        - client-web/package-lock.json
    paths:
      - client-web/node_modules/
    policy: pull
  artifacts:
    paths:
      - client-web/public/browser
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

generate_sponsor_pdfs:
  stage: build
  image: node:22-bookworm-slim
  before_script:
    - apt-get update -qq && apt-get install -y -qq chromium
  script:
    - cd sponsor-package
    - ./build.sh
  artifacts:
    paths:
      - sponsor-package/build/
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

sync_sponsor_pdfs:
  stage: sync
  image: python:3.12-slim
  needs:
    - job: generate_sponsor_pdfs
      artifacts: true
  variables:
    DIRECTUS_URL: https://cms.ageei.org
  before_script:
    - pip install requests --quiet
  script:
    - cd sponsor-package
    - python scripts/sync_sponsors.py
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

deploy:
  stage: deploy
  image: registry.gitlab.com/static-web-apps/azure-static-web-apps-deploy
  script:
    - echo "App deployed successfully."
  only:
    - main

deploy_api:
  stage: deploy
  image: mcr.microsoft.com/azure-cli
  script:
    - az login --service-principal -u $AZURE_CLIENT_ID -p $AZURE_CLIENT_SECRET --tenant $AZURE_TENANT_ID
    - az account set --subscription $AZURE_SUBSCRIPTION_ID
    - tdnf install -y maven
    - cd api
    - mvn package azure-functions:deploy -DskipTests
    - az functionapp config appsettings set
        --name ageei-admin-api
        --resource-group Ageei.org_main_site
        --settings
          WEBHOOK_SECRET="$WEBHOOK_SECRET"
          GOOGLE_CALENDAR_ID="$GOOGLE_CALENDAR_ID"
          GOOGLE_SERVICE_ACCOUNT_KEY="$GOOGLE_SERVICE_ACCOUNT_KEY"
          GOOGLE_IMPERSONATED_USER="technologie@ageei.org"
  only:
    - main
