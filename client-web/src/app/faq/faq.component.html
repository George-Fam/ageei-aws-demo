<div class="container">
  @if (isLoading) {
    <app-loading-state></app-loading-state>
  } @else if (hasError) {
    <app-error-state (retry)="ngOnInit()"></app-error-state>
  } @else {
  <app-funny-window windowTitle="faq.txt">
    <div class="main-container" fxLayout.lt-md="column" fxLayout.gt-sm="row">
      <div
        class="side-bar"
        fxFlex.gt-sm="25%"
        fxFlex.lt-md="100%"
        fxLayout.lt-md="row"
        fxLayout.gt-sm="column"
        fxLayout.xs="column"
        fxLayoutAlign.gt-sm="start start"
        fxLayoutAlign.lt-md="space-between start"
      >
        @for (category of faqCategories; track category.categoryName) {
          <div class="category-item-container"
               (click)="selectCategory(category)">
            <div
              class="category-item"
              [class.selected-category-item]="category === selectedCategory"
              [ngClass.lt-md]="'mobile-category-item'"
            >
              {{ category.categoryName }}
            </div>
          </div>
        }
      </div>
      <div class="question-container" fxFlex.gt-sm="75%" fxFlex.lt-md="100%">
        <mat-accordion>
          @for (faq of selectedCategory?.faqs ?? []; track faq) {
            <mat-expansion-panel hideToggle>
              <mat-expansion-panel-header>
                <mat-panel-title>
                  <b>{{ faq.question }}</b>
                </mat-panel-title>
              </mat-expansion-panel-header>
              <div class="faq-answer" [innerHTML]="faq.answer"></div>
            </mat-expansion-panel>
          }
        </mat-accordion>
      </div>
    </div>
  </app-funny-window>
  } <!-- end @else -->
</div>
