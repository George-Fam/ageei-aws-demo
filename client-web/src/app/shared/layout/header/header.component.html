<div>
  <div class="container" [class.hidden]="isHidden">
    <div class="nav">
      <a routerLink="/">
        <img src="/assets/logo.png" class="logo" alt="Logo" />
      </a>
      <div class="desktop-nav">
        @for (link of router_links; track link) {
          <a
            class="link hover-underline-animation"
            [routerLink]="link.url"
            [attr.aria-current]="isActiveLink(link.url) ? 'page' : null"
          >
            {{ link.name }}
          </a>
        }
      </div>
      <div class="mobile-menu" [class.menu-opened]="menuOpened">
        <button
          class="toggle-btn"
          [class.toggle-btn__cross]="menuOpened"
          (click)="menuOpened = !menuOpened"
          [attr.aria-expanded]="menuOpened"
          aria-controls="mobile-nav-menu"
          aria-label="Menu de navigation"
        >
          <div class="bar"></div>
          <div class="bar"></div>
          <div class="bar"></div>
        </button>
        <nav id="mobile-nav-menu" [attr.aria-hidden]="!menuOpened">
          <ul>
            @for (link of router_links; track link) {
              <li>
                <a
                  (click)="menuOpened = false"
                  [routerLink]="link.url"
                  [attr.aria-current]="isActiveLink(link.url) ? 'page' : null"
                >{{ link.name }}</a>
              </li>
            }
          </ul>
        </nav>
      </div>
    </div>
    <div class="divider"></div>
  </div>
  <div class="height-keeper"></div>
</div>
