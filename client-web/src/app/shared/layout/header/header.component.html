<div>
  <div class="container" id="nav-container">
    <div class="nav" fxLayout="row" fxLayoutAlign="space-between center">
      <a routerLink="/">
        <img src="/assets/logo.png" class="logo" />
      </a>
      <div fxHide.lt-md class="nav-menu" fxLayout="row" fxLayoutAlign="space-between center">
        @for (link of router_links; track link) {
        <a class="link hover-underline-animation" [routerLink]="link.url">
          {{ link.name }}
        </a>
        }
      </div>
      <div>
        <div fxHide.gt-sm class="mobile-menu">
          <input
            (change)="menuOpened = !menuOpened"
            [checked]="menuOpened"
            type="checkbox"
            id="toggle"
            style="display: none"
          />
          <label class="toggle-btn toggle-btn__cross" for="toggle">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </label>
          <nav>
            <ul>
              @for (link of router_links; track link) {
              <li>
                <a (click)="menuOpened = false" [routerLink]="link.url">{{ link.name }}</a>
              </li>
              }
            </ul>
          </nav>
        </div>
      </div>
    </div>
    <div class="divider"></div>
  </div>
  <div class="height-keeper"></div>
</div>
