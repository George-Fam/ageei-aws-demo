<div class="main-window" [style]="'width: ' + width">
  <div class="top-bar">
    <div class="dot"></div>
    <div class="dot"></div>
    <div class="dot"></div>
  </div>
  <div class="content">
    <img *ngIf="isImage" class="image" [src]="content" />
    <div *ngIf="!isImage" class="text">{{ content }}</div>
  </div>
</div>
